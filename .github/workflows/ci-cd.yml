name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION: SalesApi.sln
  IMAGE_API: pedrozulian/mouts-sales-api
  IMAGE_MIGRATOR: pedrozulian/mouts-sales-api-migrator

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

  # SalesApi.Api.Tests sobe seu próprio Postgres efêmero via Testcontainers (um container por
  # classe de teste, aplicando as migrations automaticamente) — nenhum serviço postgres nem
  # passo de migration é necessário aqui.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} --no-restore --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Publish coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml

  sonar:
    name: sonar
    runs-on: ubuntu-latest
    needs: test
    environment: Mouts
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Download coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.qualitygate.wait=true
          /s:"${{ github.workspace }}/SonarQube.Analysis.xml"

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Só roda em push a main (feature ou release) — nunca em pull_request — e só depois de
  # build/test/sonar passarem para o mesmo commit, dentro desta mesma execução. Mantém/atualiza o
  # PR de release; se o push mesclado for o próprio PR de release, cria a tag + GitHub Release
  # nesta execução.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    needs: sonar
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Habilita auto-merge no PR de release
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh pr merge --auto --merge \
            --repo "${{ github.repository }}" \
            "${{ fromJSON(steps.release.outputs.pr).number }}"

  # Só roda quando release-please criou a tag + Release nesta execução — ou seja, quando o push
  # que acabou de passar por build/test/sonar era o merge do PR de release.
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    services:
      # Postgres efêmero, usado só pelo smoke test abaixo.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: salesapi
          POSTGRES_USER: salesapi
          POSTGRES_PASSWORD: salesapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesapi -d salesapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ needs.release-please.outputs.tag_name }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATOR }}:${{ needs.release-please.outputs.tag_name }}
            ${{ env.IMAGE_MIGRATOR }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — migrator via variável de ambiente
        run: |
          docker run --rm --network host \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=salesapi;Username=salesapi;Password=salesapi" \
            ${{ env.IMAGE_MIGRATOR }}:${{ needs.release-please.outputs.tag_name }}

      - name: Smoke test — migrator via --connection
        run: |
          docker run --rm --network host \
            ${{ env.IMAGE_MIGRATOR }}:${{ needs.release-please.outputs.tag_name }} \
            --connection "Host=localhost;Port=5432;Database=salesapi;Username=salesapi;Password=salesapi"
