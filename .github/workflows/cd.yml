name: CD

on:
  release:
    types: [published]

env:
  IMAGE_API: pedrozulian/mouts-sales-api
  IMAGE_MIGRATOR: pedrozulian/mouts-sales-api-migrator

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    services:
      # Postgres efêmero, usado só pelo smoke test abaixo.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: salesapi
          POSTGRES_USER: salesapi
          POSTGRES_PASSWORD: salesapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesapi -d salesapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATOR }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_MIGRATOR }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — migrator via variável de ambiente
        run: |
          docker run --rm --network host \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=salesapi;Username=salesapi;Password=salesapi" \
            ${{ env.IMAGE_MIGRATOR }}:${{ github.event.release.tag_name }}

      - name: Smoke test — migrator via --connection
        run: |
          docker run --rm --network host \
            ${{ env.IMAGE_MIGRATOR }}:${{ github.event.release.tag_name }} \
            --connection "Host=localhost;Port=5432;Database=salesapi;Username=salesapi;Password=salesapi"
