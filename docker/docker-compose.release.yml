name: mouts-sales-api

# Mesma topologia de docker-compose.yml, com image: em vez de build: — ver README.md.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salesapi}
      POSTGRES_USER: ${POSTGRES_USER:-salesapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesapi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesapi} -d ${POSTGRES_DB:-salesapi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations pendentes e termina — etapa própria do provisionamento, fora do processo
  # de runtime da Api. A `api` só inicia depois que este serviço conclui com sucesso.
  migrator:
    image: pedrozulian/mouts-sales-api-migrator:${TAG:-latest}
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-salesapi};Username=${POSTGRES_USER:-salesapi};Password=${POSTGRES_PASSWORD:-salesapi}"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: pedrozulian/mouts-sales-api:${TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-salesapi};Username=${POSTGRES_USER:-salesapi};Password=${POSTGRES_PASSWORD:-salesapi}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
